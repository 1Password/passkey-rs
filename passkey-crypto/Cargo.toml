[package]
authors.workspace = true
categories.workspace = true
description = "Generic cryptographic backend for the passkey-rs crates"
edition.workspace = true
include = ["../LICENSE-APACHE", "../LICENSE-MIT", "src/"]
keywords.workspace = true
license.workspace = true
name = "passkey-crypto"
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version = "0.1.0"

[features]
default = ["rust-crypto"]
rand = ["dep:rand", "dep:getrandom"]
js = ["getrandom/js"]
rust-crypto = ["dep:p256", "dep:ed25519-dalek", "dep:signature", "rand", "dep:sha2", "dep:hmac"]

[dependencies]
coset.workspace = true
ed25519-dalek = { version = "3.0", optional = true, features = [ "rand_core" ] }
hmac = { version = "0.13", optional = true }
log = "0.4"
p256 = { version = "0.14", optional = true, features = [
  "arithmetic",
  "pem"
] }
rand = { version = "0.10", optional = true }
sha2 = { version = "0.11", optional = true }
signature = { version = "3.0", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", optional = true }

[lints]
workspace = true
