[package]
authors.workspace = true
categories.workspace = true
description = "A one stop library to implement a passkey client and authenticator"
edition.workspace = true
include = ["../LICENSE-APACHE", "../LICENSE-MIT", "src/"]
keywords.workspace = true
license.workspace = true
name = "passkey"
readme = "../README.md"
repository.workspace = true
rust-version.workspace = true
version = "0.5.0"

[lints]
workspace = true

[features]
default = []
linux = ["passkey-authenticator/linux", "passkey-client/linux"]
js = ["passkey-crypto/js"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package.metadata.cargo-udeps.ignore]
development = [
  "tokio-test",
] # Only used for async doctests. Cargo udeps can't check.:

[dependencies]
passkey-authenticator = { path = "../passkey-authenticator", version = "0.6" }
passkey-client = { path = "../passkey-client", version = "0.6" }
passkey-transports = { path = "../passkey-transports", version = "0.2" }
passkey-types = { path = "../passkey-types", version = "0.6" }
passkey-crypto = { path = "../passkey-crypto", version = "0.1" }

[dev-dependencies]
async-trait = "0.1"
passkey-authenticator = { path = "../passkey-authenticator", version = "0.6", features = [
  "testable",
  "tokio",
] }
passkey-client = { path = "../passkey-client", version = "0.6", features = [
  "testable",
  "tokio",
] }
passkey-crypto = { path = "../passkey-crypto", version = "0.1", features = [
  "rand"
]}
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
tokio-test = "0.4"
url = "2"
