on: push

name: CI

env:
  rust: ${{ '1.90' }}

permissions: {}

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        backend: [rust-crypto, aws-lc-rs]
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: step-security/actions-rs-toolchain@40a2f87e50bed6faa2d050e99810b226b75d8c8a # v1.0.7
        with:
          profile: minimal
          toolchain: ${{ env.rust }}
          components: clippy
          target: x86_64-pc-windows-gnu

      - name: Install libudev
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Install mingw toolchain and NASM
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 nasm

      - name: Run Clippy
        run: rustup run ${{ env.rust }} cargo clippy --all --all-targets --features ${{ matrix.backend }} -- -D warnings

      - name: Run Clippy with `linux` feature
        run: rustup run ${{ env.rust }} cargo clippy --all --features linux,${{ matrix.backend }} -- -D warnings

      - name: Run Clippy with `windows` feature
        run: rustup run ${{ env.rust }} cargo clippy --all --target x86_64-pc-windows-gnu --features windows,${{ matrix.backend }} -- -D warnings

  fmt:
    name: Rustfmt
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        backend: [rust-crypto, aws-lc-rs]
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: step-security/actions-rs-toolchain@40a2f87e50bed6faa2d050e99810b226b75d8c8a # v1.0.7
        with:
          profile: minimal
          toolchain: ${{ env.rust }}
          components: rustfmt
          target: x86_64-pc-windows-gnu

      - name: Run Rustfmt
        run: rustup run ${{ env.rust }} cargo fmt --all -- --check

  deny:
    name: Cargo Deny
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        features: [rust-crypto, aws-lc-rs, linux, windows]
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Cargo Deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check bans licenses sources
          arguments: --features ${{ matrix.features }}

  semver-checks:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install libudev
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Check semver with default features
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          package: passkey,passkey-authenticator,passkey-client,passkey-transports,passkey-types
          feature-group: default-features

      - name: Check semver with `linux` feature
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          package: passkey,passkey-authenticator,passkey-client,passkey-transports
          feature-group: default-features
          features: linux

      - name: Check semver with `windows` feature
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          package: passkey,passkey-client
          feature-group: default-features
          features: windows
          rust-target: x86_64-pc-windows-gnu

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        backend: [rust-crypto, aws-lc-rs]
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install libudev
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Install mingw toolchain and NASM
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 nasm

      - name: Install Rust toolchain
        uses: step-security/actions-rs-toolchain@40a2f87e50bed6faa2d050e99810b226b75d8c8a # v1.0.7
        with:
          profile: minimal
          toolchain: ${{ env.rust }}
          target: x86_64-pc-windows-gnu

      - name: Run rustdoc
        run: RUSTDOCFLAGS="-D warnings " rustup run ${{ env.rust }} cargo doc --workspace --no-deps --features ${{ matrix.backend }}

      - name: Run rustdoc with `linux` feature
        run: RUSTDOCFLAGS="-D warnings " rustup run ${{ env.rust }} cargo doc --workspace --no-deps --features linux,${{ matrix.backend }}

      - name: Run rustdoc with `windows` feature
        run: RUSTDOCFLAGS="-D warnings " rustup run ${{ env.rust }} cargo doc --workspace --no-deps --target x86_64-pc-windows-gnu --features windows,${{ matrix.backend }}

  build-wasm:
    name: Build-WASM
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        backend: [rust-crypto, aws-lc-rs]
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install libudev
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Install clang and emscripten
        run: sudo apt-get update && sudo apt-get install -y clang emscripten

      - name: Install Rust toolchain
        uses: step-security/actions-rs-toolchain@40a2f87e50bed6faa2d050e99810b226b75d8c8a # v1.0.7
        with:
          profile: minimal
          toolchain: ${{ env.rust }}
          target: wasm32-unknown-emscripten

      - name: Run build
        run: rustup run ${{ env.rust }} cargo build --features "passkey-client/tokio,passkey-authenticator/tokio,${{ matrix.backend }}" --target wasm32-unknown-emscripten

  test-linux:
    name: Test-Linux
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        backend: [rust-crypto, aws-lc-rs]
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: step-security/actions-rs-toolchain@40a2f87e50bed6faa2d050e99810b226b75d8c8a # v1.0.7
        with:
          profile: minimal
          toolchain: ${{ env.rust }}

      - name: Install libudev
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Run tests with `linux` feature
        run: rustup run ${{ env.rust }} cargo test --features "linux,passkey-client/tokio,passkey-authenticator/tokio,${{ matrix.backend }}"

  test-crypto-backend-compatibility:
    name: Test-Crypto-Backend-Compatibility
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: step-security/actions-rs-toolchain@40a2f87e50bed6faa2d050e99810b226b75d8c8a # v1.0.7
        with:
          profile: minimal
          toolchain: ${{ env.rust }}

      - name: Run cross-backend compatibility tests
        run: rustup run ${{ env.rust }} cargo test -p passkey-crypto --features rust-crypto,aws-lc-rs

  test-windows:
    name: Test-Windows
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    strategy:
      matrix:
        backend: [rust-crypto, aws-lc-rs]
        runs-on:
          - windows-11-arm
          - windows-2025
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: step-security/actions-rs-toolchain@40a2f87e50bed6faa2d050e99810b226b75d8c8a # v1.0.7
        with:
          profile: minimal
          toolchain: ${{ env.rust }}

      - name: Run tests
        run: rustup run ${{ env.rust }} cargo test --features "windows,passkey-client/tokio,passkey-authenticator/tokio,${{ matrix.backend }}"

  test-macos:
    name: Test-MacOS
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    strategy:
      matrix:
        backend: [rust-crypto, aws-lc-rs]
        runs-on:
          - macos-26-intel
          - macos-26
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: step-security/actions-rs-toolchain@40a2f87e50bed6faa2d050e99810b226b75d8c8a # v1.0.7
        with:
          profile: minimal
          toolchain: ${{ env.rust }}

      - name: Run tests
        run: rustup run ${{ env.rust }} cargo test --features "passkey-client/tokio,passkey-authenticator/tokio,${{ matrix.backend }}"

  typeshare:
    name: Typeshare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        lang:
          - typescript
          - kotlin
          - swift
        include:
          - fs: ts
            lang: typescript
          - fs: kt
            lang: kotlin
          - fs: swift
            lang: swift
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install typeshare CLI
        uses: baptiste0928/cargo-install@f204293d9709061b7bc1756fec3ec4e2cd57dec0 # v3.4.0
        with:
          crate: typeshare-cli
          version: "1.13.4"
          locked: true

      - name: Run typeshare CLI
        run: typeshare --lang=${{ matrix.lang }} . -o test.${{ matrix.fs }}
