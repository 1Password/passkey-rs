[package]
name = "passkey-client"
version = "0.6.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Webauthn client in Rust."
readme = "README.md"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
include = ["../LICENSE-APACHE", "../LICENSE-MIT", "src/"]

[dependencies]
ciborium = "0.2"
idna = "1"
mockall = { version = "0.11", optional = true }
nom = { version = "7", features = ["alloc"], optional = true }
passkey-authenticator = { path = "../passkey-authenticator", version = "0.6" }
passkey-crypto = { path = "../passkey-crypto", version = "0.1" }
passkey-types = { path = "../passkey-types", version = "0.6" }
public-suffix = { path = "../public-suffix", version = "0.1" }
reqwest = { version = "0.12", default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time"], optional = true }
typeshare = { version = "1", optional = true }
url = "2"
windows-sys = { version = ">=0.52.0, <0.62.0", features = ["Win32_Foundation", "Win32_Networking_WindowsWebServices", "Win32_UI_WindowsAndMessaging"], optional = true }

[dev-dependencies]
coset = { workspace = true }
mockall = { version = "0.11" }
passkey-authenticator = { path = "../passkey-authenticator", version = "0.6", features = [
  "testable",
  "tokio",
] }
tokio = { version = "1", features = ["macros", "rt"] }

[features]
android-asset-validation = ["dep:nom"]
linux = ["dep:tokio", "passkey-authenticator/linux", "tokio/rt"]
testable = ["dep:mockall"]
tokio = ["dep:tokio"]
typeshare = ["dep:typeshare", "passkey-types/typeshare"]
windows = ["dep:windows-sys"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lints]
workspace = true
