[workspace]
resolver = "2"
members = [
  "passkey",
  "passkey-authenticator",
  "passkey-client",
  "passkey-crypto",
  "passkey-transports",
  "passkey-types",
  "public-suffix",
]

[workspace.package]
# Disabling the deprecation because rust-analyzer at 1.90
# requires authors to be present
# tombi: lint.rules.deprecated.disabled = true
authors = ["1Password"]
edition = "2024"
rust-version = "1.87.0"
repository = "https://github.com/1Password/passkey-rs"
license = "MIT OR Apache-2.0"
keywords = ["ctap", "fido2", "passkey", "passwordless", "webauthn"]
categories = ["authentication"]

[workspace.dependencies]
coset = ">=0.4.2"

[workspace.lints.clippy]
as_conversions = "deny"
dbg_macro = "deny"
result_unit_err = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unused_async = "deny"

[workspace.lints.rust]
missing_docs = "warn"
unused_must_use = "forbid"
unused-qualifications = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
